---
substitutions:
  name: esp32-bluetooth-proxy
  friendly_name: Bluetooth Proxy

packages:
  # Renovate tracks the upstream main branch through pinned commit updates.
  esphome.bluetooth-proxy: >-
    github://esphome/bluetooth-proxies/esp32-generic/esp32-generic.yaml@6387b836d61375b273065501a31fe936225eb620

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret esp32_bluetooth_proxy_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
