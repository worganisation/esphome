---
name: Auto-Create PR

on:
  push:
    branches-ignore:
      - main
      - dependabot/**
      - renovate/**
  workflow_dispatch:

jobs:
  create-pr:
    name: Create PR
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__create-pull-request.yml@539b889c12470285760b747e8bb4a4c221213b59 # shared CI
    with:
      base-ref-name: ${{ github.event.repository.default_branch }}
      head-ref-name: ${{ github.ref_name }}
      pr-draft: true
      update-pr-body-if-exists: true
    secrets: inherit
